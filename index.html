<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Product Landing Page</title>
    <link rel="stylesheet" href="styles.css">
  </head>

<body>
<header id="header">

<img
id="header-img"
src="https://cdn.freecodecamp.org/testable-projects-fcc/images/product-landing-page-logo.png"
alt="Product Logo">

<nav id="nav-bar">

<a class="nav-link" href="#features">Features</a>

<a class="nav-link" href="#video-section">Video</a>

<a class="nav-link" href="#pricing">Pricing</a>

</nav>

</header>

<section id="features">

<h2>Features</h2>

<p>Our product is designed to improve productivity.</p>

<p>Easy to use interface.</p>

<p>Fast and secure.</p>

</section>

<section id="video-section">

<h2>Watch Demo</h2>

<iframe
id="video"
src="https://www.youtube.com/embed/y8Yv4pnO7qc"
title="Product Video"
allowfullscreen>
</iframe>

</section>

<section id="pricing">

<h2>Pricing</h2>

<div class="pricing-container">

<div class="card">
<h3>Basic</h3>
<p>$10/month</p>
<button>Select</button>
</div>

<div class="card">
<h3>Standard</h3>
<p>$20/month</p>
<button>Select</button>
</div>

<div class="card">
<h3>Premium</h3>
<p>$30/month</p>
<button>Select</button>
</div>

</div>

</section>

<section id="contact">

<h2>Subscribe</h2>

<form
id="form"
action="https://www.freecodecamp.org/email-submit">

<input
id="email"
name="email"
type="email"
placeholder="Enter your email address"
required>

<input
id="submit"
type="submit"
value="Get Started">

</form>

</section>

</body>

</html>
